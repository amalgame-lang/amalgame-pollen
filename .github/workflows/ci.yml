name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # v0.8.52 is the latest released amc at the time of the
        # package's first publish. Bump when newer features land
        # on the package side ; the package's required-amalgame in
        # amalgame.toml is the source of truth for consumers.
        amc-tag: [v0.8.52]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get install -y libgc-dev libssl-dev

      - name: Download amc
        run: |
          TAG="${{ matrix.amc-tag }}"
          VERSION="${TAG#v}"
          curl -sSL -o amc.tar.gz \
            "https://github.com/amalgame-lang/Amalgame/releases/download/${TAG}/amc-${VERSION}-linux-x86_64.tar.gz"
          mkdir -p $RUNNER_TEMP/amc-install
          tar -xzf amc.tar.gz -C $RUNNER_TEMP/amc-install --strip-components=1
          echo "AMC=$RUNNER_TEMP/amc-install/bin/amc" >> $GITHUB_ENV

      - name: Build package archive
        run: |
          "$AMC" --lib --quiet facade.am -o /tmp/Pollen-facade
          gcc -O2 -I"$RUNNER_TEMP/amc-install/share/amalgame/runtime" \
              -I"./runtime" -c /tmp/Pollen-facade.c -o /tmp/Pollen-facade.o
          mkdir -p build/linux-x86_64
          ar rcs build/linux-x86_64/libamalgame-pkg-Pollen.a /tmp/Pollen-facade.o
          ls -la build/linux-x86_64/

      - name: Run smoke tests
        run: ./tests/run_tests.sh "$AMC"
