
[package]
name = "amalgame-pollen"
version = "0.5.0"
license = "Apache-2.0"
description = "Workflow engine for Pollen — runs workflow.json v3 entries over a P2P TCP message bus."
authors = ["Bastien Mouget"]
required-amalgame = ">=0.8.52"
schema-version = 1

[stdlib]
class = "Pollen"
header = "runtime/Amalgame_Pollen.h"
namespace = "Amalgame.Pollen"
facade = "facade.am"
libs = ["pthread"]

[stdlib.functions]

[stdlib.functions.WorkflowLoad]
returns = "code_bool"

[stdlib.functions.WorkflowSetSharedDir]
returns = "void"

[stdlib.functions.WorkflowSetSelf]
returns = "void"

[stdlib.functions.WorkflowReloadBegin]
