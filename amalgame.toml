[stdlib.functions.WorkflowSetEmitTopic]
returns = "void"

[stdlib.functions.CondBranchOpen]
returns = "void"

[stdlib.functions.CondBranchAddTarget]
returns = "void"

[stdlib.functions.CondBranchSetTopic]
returns = "void"

[stdlib.functions.SetOpAdd]
returns = "void"

[stdlib.functions.ForSetup]
returns = "void"

[stdlib.functions.ForAddTarget]
returns = "void"

[stdlib.functions.ForAddItem]
returns = "void"

[stdlib.functions.ForSetTopic]
returns = "void"

[stdlib.functions.WhileSetup]
